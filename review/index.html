<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Leave a Review · Flip Lab with Coach Steve</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--blue:#1e8cff;--blue-light:#63b3ff;--white:#f5f8ff;--muted:#8b97ad;--border:rgba(30,140,255,.22);--card:#101827}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;padding:36px 16px 60px}
.wrap{max-width:460px;margin:0 auto}
.logo{display:block;margin:0 auto 28px;height:64px;width:auto}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:44px;letter-spacing:2px;line-height:1;margin-bottom:10px}
.sub{font-size:15px;color:rgba(245,248,255,.62);line-height:1.7;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);padding:24px;border-radius:6px}
.fl{font:10px 'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:20px 0 8px;display:block}
.fl:first-child{margin-top:0}
.stars{display:flex;gap:6px}
.stars button{background:none;border:none;font-size:36px;color:#2a3550;cursor:pointer;line-height:1;padding:0}
.stars button.on{color:var(--blue-light)}
input[type=text],textarea{width:100%;background:#0a0f1c;border:1px solid var(--border);color:var(--white);border-radius:6px;padding:12px;font:16px 'DM Sans',sans-serif}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font:14px 'DM Sans',sans-serif;padding:9px 15px;border:1px solid var(--border);border-radius:99px;background:transparent;color:var(--white);cursor:pointer}
.chips button.on{background:var(--blue);color:#03101f;border-color:var(--blue);font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:20px;line-height:1.5;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--blue);width:16px;height:16px;flex:none}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.btn{display:block;width:100%;margin-top:22px;padding:15px;border:none;border-radius:4px;background:var(--blue);color:#03101f;font:800 13px 'DM Sans',sans-serif;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.err{display:none;margin-top:14px;font-size:14px;color:#ff8a8a}
.thanks{display:none;text-align:center;padding-top:10px}
.check{width:68px;height:68px;border-radius:50%;border:2px solid var(--blue);display:grid;place-items:center;margin:0 auto 18px;font-size:30px;color:var(--blue-light)}
.home{display:inline-block;margin-top:10px;color:var(--blue-light);font-weight:600;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/images/logo.png" alt="Flip Lab with Coach Steve">

  <div id="formBox">
    <h1>How's it going?</h1>
    <p class="sub">Thanks for training with Flip Lab! A quick review helps other parents find us. It takes about 30 seconds.</p>
    <form class="card" id="reviewForm" novalidate>
      <span class="fl">Your rating</span>
      <div class="stars" id="stars" role="radiogroup" aria-label="Rating"></div>

      <label class="fl" for="text">Your review</label>
      <textarea id="text" maxlength="1000" placeholder="What changed for your athlete? (confidence, a new skill, a mental block…)"></textarea>

      <label class="fl" for="name">Your first name</label>
      <input type="text" id="name" maxlength="40" autocomplete="given-name" placeholder="e.g. Jessica">
      <div class="hint">Shown as first name only.</div>

      <span class="fl">Your athlete does</span>
      <div class="chips" id="sport">
        <button type="button" class="on">Cheer</button><button type="button">Dance</button><button type="button">Gymnastics</button><button type="button">Other</button>
      </div>

      <div class="trap" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>

      <label class="chk"><input type="checkbox" id="consent" checked> OK to show my review on the Flip Lab website.</label>

      <button class="btn" type="submit" id="send">Send Review</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <div class="thanks" id="thanks">
    <div class="check">✓</div>
    <h1>Thank you!</h1>
    <p class="sub">Coach Steve really appreciates it.</p>
    <a class="home" href="/">← Back to Flip Lab</a>
  </div>
</div>

<script>
var rating = 5;
function drawStars() {
  document.getElementById('stars').innerHTML = [1,2,3,4,5].map(function(i) {
    return '<button type="button" role="radio" aria-checked="' + (i === rating) + '" aria-label="' + i + ' star' + (i > 1 ? 's' : '') + '" class="' + (i <= rating ? 'on' : '') + '" data-v="' + i + '">★</button>';
  }).join('');
}
document.getElementById('stars').addEventListener('click', function(e) {
  var b = e.target.closest('button'); if (!b) return;
  rating = +b.dataset.v; drawStars();
});
document.getElementById('sport').addEventListener('click', function(e) {
  var b = e.target.closest('button'); if (!b) return;
  this.querySelectorAll('button').forEach(function(x) { x.classList.remove('on'); });
  b.classList.add('on');
});
drawStars();

document.getElementById('reviewForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var err = document.getElementById('err'), btn = document.getElementById('send');
  var text = document.getElementById('text').value.trim();
  var name = document.getElementById('name').value.trim();
  err.style.display = 'none';
  if (text.length < 5) { err.textContent = 'Please write a little more in your review.'; err.style.display = 'block'; return; }
  if (!name) { err.textContent = 'Please add your first name.'; err.style.display = 'block'; return; }
  if (!document.getElementById('consent').checked) { err.textContent = 'Please check the box to let us show your review.'; err.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Sending...';
  fetch('/api/reviews', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      rating: rating, text: text, name: name,
      sport: document.querySelector('#sport .on').textContent,
      consent: true,
      website: document.getElementById('website').value
    })
  }).then(function(r) { return r.json(); }).then(function(res) {
    if (!res.ok) throw new Error(res.error || 'Something went wrong.');
    document.getElementById('formBox').style.display = 'none';
    document.getElementById('thanks').style.display = 'block';
    window.scrollTo(0, 0);
  }).catch(function(e2) {
    btn.disabled = false; btn.textContent = 'Send Review';
    err.textContent = e2.message || 'Something went wrong. Please try again.';
    err.style.display = 'block';
  });
});
</script>
</body>
</html>
